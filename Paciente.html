<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consulta de salud</title>
<style>
:root{--ink:#12263a;--bg:#eef3f8;--p:#1d4ed8;--mut:#5a6b7b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Segoe UI,sans-serif;padding-bottom:2rem}
header{background:var(--p);color:#fff;padding:1.2rem 1.2rem 3rem}
header small{opacity:.85}h1{margin:.1rem 0 0;font-size:1.5rem}
main{max-width:600px;margin:-1.8rem auto 0;padding:0 1rem}
.card{background:#fff;border-radius:16px;padding:1.1rem;margin-bottom:1rem;box-shadow:0 6px 20px #12263a14}
h2{margin:0 0 .5rem;font-size:1.05rem}
input{width:100%;font:inherit;padding:.65rem;margin:.25rem 0;border:1.5px solid #d3dce6;border-radius:10px}
input:focus{outline:2px solid var(--p);border-color:transparent}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.btn{width:100%;font:inherit;font-weight:600;padding:.75rem;margin-top:.4rem;border:0;border-radius:10px;background:var(--p);color:#fff;cursor:pointer}
.btn:hover{filter:brightness(1.12)}.gris{background:#64748b}
.estado{border-left:6px solid var(--c);padding:.2rem 0 .2rem .9rem}
.estado b{display:block;font-size:1.25rem}
.esc{position:relative;height:10px;border-radius:6px;background:linear-gradient(90deg,#60a5fa 0 14%,#22c55e 14% 40%,#facc15 40% 60%,#ef4444 60%);margin:1.2rem 0 .5rem}
.esc i{position:absolute;top:-5px;width:4px;height:20px;background:var(--ink);border-radius:2px}
.datos{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.8rem}
.datos div{background:#f3f6fa;border-radius:10px;padding:.55rem .7rem;font-size:.88rem}.datos b{display:block;font-size:1.05rem}
ul{padding-left:1.1rem;margin:.3rem 0}li{margin:.35rem 0}
.nota{color:var(--mut);font-size:.88rem}.error{color:#b91c1c}
.hist li{list-style:none;display:flex;justify-content:space-between;gap:.5rem;padding:.45rem 0;border-bottom:1px solid #eef1f5;margin:0}
.hist button{border:0;background:none;color:#c62828;cursor:pointer}
@media print{header,#form,#hist,.btn{display:none}body{background:#fff}.card{box-shadow:none;border:1px solid #ddd}}
</style></head><body>
<header><small>Evaluación por IMC con plan de mejora</small><h1>Consulta de salud</h1></header>
<main>
<div class="card" id="form"><h2>Datos del paciente</h2>
  <input id="nom" placeholder="Nombre del paciente">
  <div class="tres"><input id="edad" type="number" placeholder="Edad"><input id="alt" type="number" placeholder="Altura (cm)"><input id="peso" type="number" step="0.1" placeholder="Peso (kg)"></div>
  <button class="btn" onclick="evaluar()">Evaluar paciente</button>
</div>
<div id="out"></div>
<div class="card" id="hist"><h2>Pacientes evaluados</h2><ul class="hist" id="lh"></ul><button class="btn gris" onclick="borrarH()">Borrar historial</button></div>
</main>
<script>
const $=id=>document.getElementById(id);
let D={pac:[]};
try{D={...D,...JSON.parse(localStorage.getItem('pac'))}}catch(e){}
const guardar=()=>{try{localStorage.setItem('pac',JSON.stringify(D))}catch(e){}};
const P={
 bajo:{t:'Bajo peso',ok:false,c:'#2563eb',
  dieta:['Haga 5 comidas al día y no se salte ninguna.','Incluya frutos secos, aguacate, legumbres, huevos, lácteos y cereales integrales.','Agregue una fuente de proteína en cada comida.'],
  ej:['Fuerza 3 días por semana, 30 a 40 min: sentadillas, flexiones, remo con banda y plancha.','Caminata ligera de 20 min, 2 días por semana.']},
 normal:{t:'Peso normal',ok:true,c:'#16a34a',
  dieta:['Mantenga una dieta equilibrada: verduras, frutas, proteínas y cereales integrales.','Tome agua durante el día y limite los dulces y las frituras.'],
  ej:['150 min por semana de actividad moderada (caminata rápida, bicicleta o natación).','Fuerza 2 días por semana, de 20 a 30 min.']},
 sobre:{t:'Sobrepeso',ok:false,c:'#ca8a04',
  dieta:['Llene la mitad del plato con verduras y frutas.','Reduzca bebidas azucaradas, ultraprocesados, frituras y dulces.','Cuide las porciones y prefiera proteínas magras (pollo, pescado, legumbres).'],
  ej:['Caminata rápida, bicicleta o natación: 30 a 45 min, 5 días por semana.','Fuerza 2 días por semana, de 20 a 30 min.']},
 obeso:{t:'Obesidad',ok:false,c:'#dc2626',
  dieta:['Llene la mitad del plato con verduras y frutas.','Reduzca bebidas azucaradas, ultraprocesados, frituras y dulces.','Busque a un nutricionista y evite las dietas extremas.'],
  ej:['Consulte a su médico antes de empezar.','Comience con caminatas de 20 a 30 min, 5 días por semana, y suba 5 min cada semana.','Alterne con natación o bicicleta estática (bajo impacto) y fuerza suave 2 días por semana.']}
};
const HAB=['Duerma de 7 a 9 horas y tome agua durante el día.','Evite el tabaco y limite el alcohol.','Haga una pausa activa cada hora si trabaja sentado.','Hágase un chequeo médico una vez al año.'];
const lis=a=>'<ul>'+a.map(x=>`<li>${x}</li>`).join('')+'</ul>';

function evaluar(){
  const n=$('nom').value.trim()||'Paciente',e=+$('edad').value,a=+$('alt').value,p=+$('peso').value;
  if(!(e>=1&&e<=110&&a>=50&&a<=250&&p>=2&&p<=300)){
    $('out').innerHTML='<div class="card"><p class="error">Revise los datos: edad de 1 a 110, altura de 50 a 250 cm y peso de 2 a 300 kg.</p></div>';return;
  }
  const h=a/100,imc=p/(h*h),pmin=18.5*h*h,pmax=24.9*h*h;
  const k=imc<18.5?'bajo':imc<25?'normal':imc<30?'sobre':'obeso',c=P[k];
  const datos=`<div class="datos"><div>IMC<b>${imc.toFixed(1)}</b></div><div>Peso saludable<b>${pmin.toFixed(1)} a ${pmax.toFixed(1)} kg</b></div></div>`;
  if(e<18){
    $('out').innerHTML=`<div class="card"><h2>${n}</h2>${datos}<p>En menores de 18 años el IMC se interpreta con curvas de crecimiento (percentiles). Consulte a su pediatra.</p></div>`;return;
  }
  let tiempo;
  if(k=='bajo'){const d=pmin-p;tiempo=[`Le faltan unos ${d.toFixed(1)} kg para entrar al rango saludable.`,`A 0,25 - 0,5 kg por semana: entre ${Math.ceil(d/0.5)} y ${Math.ceil(d/0.25)} semanas.`]}
  else if(k=='normal')tiempo=['Objetivo: mantener su peso y completar 150 min de actividad por semana.'];
  else{const d=p-pmax;tiempo=[`Primera meta: bajar entre ${(p*.05).toFixed(1)} y ${(p*.1).toFixed(1)} kg (5% a 10%) en 3 a 6 meses.`,`Para llegar al rango saludable faltan unos ${d.toFixed(1)} kg.`,`A 0,5 - 1 kg por semana: entre ${Math.ceil(d)} y ${Math.ceil(d/0.5)} semanas.`]}
  const ej=e>=65?[...c.ej,'Agregue ejercicios de equilibrio 3 días por semana (por ejemplo, pararse en un pie con apoyo).']:c.ej;
  const pos=Math.max(0,Math.min(100,(imc-15)/25*100));
  $('out').innerHTML=`
   <div class="card"><div class="estado" style="--c:${c.c}"><small class="nota">${n}, ${e} años</small>
     <b>${c.ok?'Se encuentra en buen estado':'Necesita mejorar'}</b>Clasificación: ${c.t}</div>
     <div class="esc"><i style="left:calc(${pos}% - 2px)"></i></div>${datos}</div>
   <div class="card"><h2>Dieta</h2>${lis(c.dieta)}</div>
   <div class="card"><h2>Ejercicios</h2>${lis(ej)}</div>
   <div class="card"><h2>Tiempo y metas</h2>${lis(tiempo)}</div>
   <div class="card"><h2>Hábitos</h2>${lis(HAB)}
     <p class="nota">Esta evaluación usa solo el IMC y no reemplaza una consulta médica.</p>
     <button class="btn" onclick="window.print()">Imprimir informe</button></div>`;
  D.pac.unshift({n:n,e:e,imc:imc.toFixed(1),t:c.t,f:new Date().toLocaleDateString()});
  D.pac=D.pac.slice(0,15);guardar();historial();
}
function historial(){
  $('lh').innerHTML=D.pac.length?D.pac.map((x,i)=>`<li><span>${x.n} (${x.e} años)<br><small class="nota">${x.f}</small></span><span>IMC ${x.imc}, ${x.t} <button onclick="quitar(${i})" title="Borrar">✕</button></span></li>`).join(''):'<li>Aún no hay pacientes evaluados.</li>';
}
function quitar(i){D.pac.splice(i,1);guardar();historial()}
function borrarH(){if(confirm('¿Borrar todo el historial?')){D.pac=[];guardar();historial()}}
historial();
</script></body></html>
